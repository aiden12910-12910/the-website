name: Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: |
          npm install --no-save eslint htmlhint stylelint stylelint-config-standard
          npm install --no-save @playwright/test http-server
          npm install --no-save lychee
          npx playwright install --with-deps chromium

      - name: Run scanner
        run: node scan.js

      - name: Commit results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scan-error-data.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update scan-error-data.json [skip ci]"
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: scan-error-data.json
