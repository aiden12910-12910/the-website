name: Scan

on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - '404.html'
      - 'api/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [run-scan]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: |
          npm install --no-save eslint@8 htmlhint stylelint
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Verify tools
        run: |
          npx eslint --version
          npx htmlhint --version
          npx stylelint --version
          npx playwright --version
          ls node_modules/.bin/ | grep -E "eslint|htmlhint|stylelint" || echo "MISSING TOOLS"

      - name: Run scanner (ESLint + HTMLHint + Stylelint + Playwright)
        run: node scan.js

      - name: Check dead links (lychee)
        id: lychee
        continue-on-error: true
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress --format json --output lychee.json index.html
          fail: false

      - name: Merge lychee results
        if: always()
        run: node scan.js --merge-lychee

      - name: Commit results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scan-error-data.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update scan-error-data.json [skip ci] [vercel skip]"
            git push
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: |
            scan-error-data.json
            lychee.json
