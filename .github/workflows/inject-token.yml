name: Inject Token and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  inject-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check token placeholder exists
        run: |
          if ! grep -q 'ghp_yourtoken' index.html; then
            echo "Placeholder token not found in index.html"
            exit 1
          fi

      - name: Inject GitHub token into HTML
        run: |
          sed -i "s/ghp_yourtoken/${{ secrets.MY_GITHUB_TOKEN }}/g" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
