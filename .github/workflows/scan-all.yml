name: Scan All Files

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: |
          npm install --no-save eslint htmlhint stylelint stylelint-config-standard
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Run ESLint (JS)
        id: eslint
        continue-on-error: true
        run: |
          mkdir -p scan-results
          npx eslint js/ api/ --ext .js -f json -o scan-results/eslint.json || true
          echo "eslint_done=true" >> $GITHUB_OUTPUT

      - name: Run HTMLHint (HTML)
        id: htmlhint
        continue-on-error: true
        run: |
          mkdir -p scan-results
          npx htmlhint index.html 404.html --format json > scan-results/htmlhint.json || true
          echo "htmlhint_done=true" >> $GITHUB_OUTPUT

      - name: Run Stylelint (CSS)
        id: stylelint
        continue-on-error: true
        run: |
          mkdir -p scan-results
          npx stylelint "css/*.css" --formatter json > scan-results/stylelint.json || true
          echo "stylelint_done=true" >> $GITHUB_OUTPUT

      - name: Run Playwright smoke test
        id: playwright
        continue-on-error: true
        run: |
          mkdir -p scan-results
          npx http-server . -p 3000 -s &
          sleep 2
          npx playwright test --reporter=json > scan-results/playwright.json || true
          echo "playwright_done=true" >> $GITHUB_OUTPUT

      - name: Check dead links (lychee)
        id: lychee
        continue-on-error: true
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress --format json --output scan-results/links.json index.html
          fail: false

      - name: Merge results into error-data.json
        id: merge
        run: |
          node scripts/merge-results.js

      - name: Commit error-data.json back to repo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add error-data.json
          if git diff --staged --quiet; then
            echo "No changes to error-data.json"
          else
            git commit -m "chore: update error-data.json [skip ci]"
            git push
          fi

      - name: Upload scan results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: |
            scan-results/
            error-data.json
