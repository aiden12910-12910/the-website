name: Clear GitHub Issues

on:
  schedule:
    - cron: '0 0 * * *'   # 每天午夜 00:00 运行一次
    - cron: '0 12 * * *'  # 每天中午 12:00 运行一次
  workflow_dispatch:

jobs:
  clear-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Delete User-Log Issues Only
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            console.log('欢迎使用🚀 开始执行清理 User-Log Issues 任务...');
            
            let deletedIssues = [];

            // 先列出所有 open 的 log issues
            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'User-Log',
              per_page: 100,
            });

            if (issues.data.length === 0) {
              console.log('✅ 没有需要删除的 User-Log issues');
              return;
            }

            console.log('📋 即将删除的 User-Log issues:');
            console.log('| # | Title | Author | Created At |');
            console.log('|---|---|---|---|');

            for (const issue of issues.data) {
              const createdAt = new Date(issue.created_at).toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
              });

              console.log(`| #${issue.number} | ${issue.title} | ${issue.user.login} | ${createdAt} |`);

              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'closed',
              });

              deletedIssues.push({
                number: issue.number,
                title: issue.title,
                author: issue.user.login,
                createdAt
              });
            }

            console.log('\n✅ 删除完成！');
            console.log(`共删除 ${deletedIssues.length} 个 User-Log issues`);
